services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dockertask}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  eureka:
    image: ${DOCKERHUB_USERNAME:-local}/buspass-eureka:latest
    build:
      context: ./EurekaServer/EurekaServer
      dockerfile: Dockerfile
    ports:
      - "${EUREKA_HOST_PORT:-8762}:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || curl -fsS http://localhost:8761/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    image: ${DOCKERHUB_USERNAME:-local}/buspass-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dockertask}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: backend
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    ports:
      - "${BACKEND_HOST_PORT:-8082}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/BusPass/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/buspass-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
