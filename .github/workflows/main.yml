
name: SOATaskWorkspace Docker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/backend.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/soataskworkspace-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/soataskworkspace-backend:${{ github.sha }}

      - name: Build and push Eureka Server image
        uses: docker/build-push-action@v6
        with:
          context: ./EurekaServer/EurekaServer
          file: ./EurekaServer/EurekaServer/eureka.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/soataskworkspace-eureka:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/soataskworkspace-eureka:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/frontend-react
          file: ./frontend/frontend-react/frontend.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/soataskworkspace-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/soataskworkspace-frontend:${{ github.sha }}
